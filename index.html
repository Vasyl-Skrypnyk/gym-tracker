<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0e" />
    <meta name="description" content="Личный офлайн-дневник тренировок" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Зал" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Железо — дневник тренировок</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-action="go-home" aria-label="На главную">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M5 12v8M9 9v14M23 9v14M27 12v8M9 16h14" /></svg>
          </span>
          <span>
            <strong>ЖЕЛЕЗО</strong>
            <small id="online-status">локальный дневник</small>
          </span>
        </button>
        <div class="date-pill" id="today-label"></div>
      </header>

      <main id="app" class="view" aria-live="polite">
        <div class="loading-screen">
          <span class="loader"></span>
          <p>Загружаем блины…</p>
        </div>
      </main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Основная навигация">
        <button data-route="home" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z" /></svg>
          <span>Главная</span>
        </button>
        <button data-route="history" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M4 4v5h5M5.5 8.5A8 8 0 1 1 4 13M12 8v5l3 2" /></svg>
          <span>История</span>
        </button>
        <button data-route="progress" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="m4 18 5-6 4 3 7-9M16 6h4v4" /></svg>
          <span>Прогресс</span>
        </button>
        <button data-route="settings" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z" /></svg>
          <span>Настройки</span>
        </button>
      </nav>
    </div>

    <dialog id="exercise-dialog" class="sheet-dialog">
      <div class="sheet-handle"></div>
      <div class="dialog-head">
        <div>
          <p class="eyebrow">УПРАЖНЕНИЯ</p>
          <h2>Что качаем?</h2>
        </div>
        <button class="icon-button" data-action="close-exercise-dialog" aria-label="Закрыть">×</button>
      </div>
      <label class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m16 16 4 4" /></svg>
        <input id="exercise-search" type="search" placeholder="Найти упражнение" autocomplete="off" />
      </label>
      <div id="exercise-picker" class="exercise-picker"></div>
      <button class="button button-secondary full-width" data-action="open-new-exercise">+ Создать своё упражнение</button>
    </dialog>

    <dialog id="new-exercise-dialog" class="compact-dialog">
      <form id="new-exercise-form">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">СВОЁ УПРАЖНЕНИЕ</p>
            <h2>Добавить</h2>
          </div>
          <button type="button" class="icon-button" data-action="close-new-exercise" aria-label="Закрыть">×</button>
        </div>
        <label class="field-label">Название
          <input name="name" type="text" maxlength="48" placeholder="Например, жим в Хаммере" required />
        </label>
        <label class="field-label">Группа мышц
          <select name="category" required>
            <option>Грудь</option><option>Спина</option><option>Ноги</option>
            <option>Плечи</option><option>Руки</option><option>Кор</option><option>Другое</option>
          </select>
        </label>
        <button class="button button-primary full-width" type="submit">Добавить упражнение</button>
      </form>
    </dialog>

    <div id="timer-bar" class="timer-bar" hidden>
      <div>
        <small>ОТДЫХ</small>
        <strong id="timer-value">01:30</strong>
      </div>
      <div class="timer-actions">
        <button data-action="timer-minus">−15</button>
        <button data-action="timer-plus">+15</button>
        <button data-action="timer-stop">Пропустить</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />

    <script type="module" src="./app.js"></script>
  </body>
</html>
